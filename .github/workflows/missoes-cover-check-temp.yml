name: Validar capas cover das missoes (temporario)

on:
  push:
    branches:
      - feat/missoes-desafio-2

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatar e salvar alteracoes na branch
        run: |
          npx prettier --write src/components/cena-palco-missao.tsx src/styles-missoes-arte-inteira.css
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cena-palco-missao.tsx src/styles-missoes-arte-inteira.css
          if ! git diff --cached --quiet; then
            git commit -m "style(missoes): formatar CSS do palco em capa inteira"
            git push origin HEAD:feat/missoes-desafio-2
          fi
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Compilar onboarding
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - name: Compilar estudos
        run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
