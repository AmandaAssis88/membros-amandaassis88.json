name: Validar ambientes do Café (temporário)

on:
  push:
    branches:
      - feat/missoes-desafio-2

permissions:
  contents: write

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatar apenas os arquivos dos ambientes
        run: |
          npx prettier --write estudos/src/cantinho/temas.ts estudos/src/cantinho/temas.test.ts estudos/src/cantinho/cantinho.tsx estudos/src/cantinho/ambientes.css estudos/src/pages/inicio.tsx estudos/src/main.tsx estudos/public/temas/ambientes/README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estudos/src/cantinho/temas.ts estudos/src/cantinho/temas.test.ts estudos/src/cantinho/cantinho.tsx estudos/src/cantinho/ambientes.css estudos/src/pages/inicio.tsx estudos/src/main.tsx estudos/public/temas/ambientes/README.md
          if ! git diff --cached --quiet; then
            git commit -m "style(estudos): formatar a coleção de ambientes"
            git push origin HEAD:feat/missoes-desafio-2
          fi
      - name: Conferir WebP da home e da gaveta
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const ids = ['lofi','cabana','biblioteca','neon','laboratorio','solar'];
          for (const id of ids) {
            for (const prefix of ['', 'thumbs/']) {
              const path = 'estudos/public/temas/ambientes/' + prefix + id + '.webp';
              const b = readFileSync(path);
              if (b.toString('ascii',0,4)!=='RIFF'||b.toString('ascii',8,12)!=='WEBP') {
                throw new Error('WebP inválido: '+path);
              }
              if (b.length > 200_000) throw new Error('Imagem muito pesada: '+path);
            }
          }
          console.log('12 imagens WebP válidas, com tamanho controlado.');
          NODE
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
