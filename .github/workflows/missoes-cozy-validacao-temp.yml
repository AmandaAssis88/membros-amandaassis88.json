name: Validar capas lo-fi — temporário
on:
  push:
    branches:
      - feat/missoes-desafio-2
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir arquivos de capa e tamanhos
        run: |
          python - <<'PY'
          from pathlib import Path
          nomes = "incendio cafeteria abrigo nave laboratorio castelo farol biblioteca robo jardim feira pinguim".split()
          pasta = Path("public/missoes/capas")
          for nome in nomes:
              p = pasta / f"{nome}.webp"
              assert p.exists(), p
              b = p.read_bytes()
              assert b[:4] == b"RIFF" and b[8:12] == b"WEBP", p
              assert 15000 < len(b) < 120000, (p, len(b))
          print(f"{len(nomes)} capas WebP validas.")
          PY
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Build onboarding
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - name: Build Café de Estudos
        run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
