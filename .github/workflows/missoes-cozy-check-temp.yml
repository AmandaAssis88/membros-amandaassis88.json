name: Validação temporária — Arte Cozy das missões

on:
  push:
    branches:
      - feat/missoes-desafio-2

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Atualizar rotas e formatar componentes
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
        run: |
          npx vite build
          npx prettier --write src/components/cena-de-fundo-missao.tsx src/components/cartao-missao.tsx 'src/routes/missoes/$slug.tsx' src/styles-missoes-cozy.css src/main.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cena-de-fundo-missao.tsx src/components/cartao-missao.tsx 'src/routes/missoes/$slug.tsx' src/styles-missoes-cozy.css src/main.tsx src/routeTree.gen.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(missoes): formatar layout cozy e componentes"
            git push origin HEAD:feat/missoes-desafio-2
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
