name: Verificar novas capas de missões (temporário)

on:
  push:
    branches:
      - feat/missoes-desafio-2

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checar TypeScript, ESLint e estilos
        run: npm run lint
      - name: Testes e integridade dos WebP
        run: npm test
      - name: Compilar site da comunidade
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - name: Compilar Café de Estudos
        run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
