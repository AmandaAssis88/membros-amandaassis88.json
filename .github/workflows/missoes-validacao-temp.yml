name: Validação temporária do Desafio 2

on:
  push:
    branches:
      - feat/missoes-desafio-2

permissions:
  contents: write

jobs:
  checks:
    name: Formatação, testes e builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Aplicar Prettier apenas aos arquivos alterados na branch
        run: |
          npx prettier --write src/components/cena-missao.tsx src/components/cartao-missao.tsx src/components/community-ui.tsx src/components/onboarding.tsx src/main.tsx src/styles-missoes.css src/lib/missoes.ts src/lib/missoes.test.ts src/routes/missoes/index.tsx 'src/routes/missoes/$slug.tsx'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cena-missao.tsx src/components/cartao-missao.tsx src/components/community-ui.tsx src/components/onboarding.tsx src/main.tsx src/styles-missoes.css src/lib/missoes.ts src/lib/missoes.test.ts src/routes/missoes/
          if ! git diff --cached --quiet; then
            git commit -m "style(missoes): formatar componentes e páginas do Desafio 2"
            git push origin HEAD:feat/missoes-desafio-2
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
