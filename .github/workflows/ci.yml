name: CI

permissions:
  contents: write

on:
  pull_request:
    paths-ignore:
      - "membros/**"
      - "**.md"

jobs:
  build:
    name: Lint, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatar componentes do Pomodoro na branch de testes
        if: github.head_ref == 'pomodoro'
        run: |
          npx prettier --write estudos/src/components/mini-player.tsx estudos/src/components/pomodoro.tsx estudos/src/components/pomodoro-logica.ts estudos/src/components/pomodoro-logica.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estudos/src/components/mini-player.tsx estudos/src/components/pomodoro.tsx estudos/src/components/pomodoro-logica.ts estudos/src/components/pomodoro-logica.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(estudos): formatar código do Pomodoro"
            git push origin HEAD:pomodoro
          fi
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      - run: npm run build:estudos
        env:
          VITE_SUPABASE_URL: https://exemplo.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
